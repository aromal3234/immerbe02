services:
  - type: web
    name: immarbe-verification
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: MONGO_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASS
        sync: false
